<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TEEHEET Demon List</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
    }

    header {
      background: #111;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #ffd900;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: 2px;
      color: #ffd900;
    }

    .container {
      width: 80%;
      max-width: 1000px;
      margin: 40px auto;
    }

    .level-card {
      background: #121212;
      border: 1px solid #2a2a2a;
      border-left: 5px solid #ffd900;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 0 15px rgba(255, 217, 0, 0.1);
    }

    .rank {
      font-size: 26px;
      font-weight: bold;
      color: #ffd900;
    }

    .level-name {
      font-size: 24px;
      font-weight: bold;
      margin-top: 5px;
    }

    .verifier {
      font-size: 14px;
      color: #bbb;
      margin-top: 5px;
    }

    iframe {
      width: 100%;
      height: 420px;
      border-radius: 8px;
      border: none;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>TEEHEET Demon List</h1>
  </header>

  <div class="container">

    <!-- LEVEL 1 -->
    <div class="level-card">

      <div class="rank">#1</div>
      <div class="level-name">Thinking Space II</div>
      <div class="verifier">Verified by: Zoink</div>

      <iframe 
        src="https://www.youtube.com/embed/CELNmHwln_c"
        allowfullscreen>
      </iframe>

    </div>

  </div>

</body>
</html>
